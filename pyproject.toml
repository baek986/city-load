[project]
name = "city-load"
version = "0.1.0"
description = "Joint routing and 3D loading for urban pharmacy delivery"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.11",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
